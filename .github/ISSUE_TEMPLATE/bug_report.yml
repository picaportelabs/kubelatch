name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: kubelatch-server version (the Edition page, or `kubelatch-server version`)
    validations:
      required: true
  - type: textarea
    id: install
    attributes:
      label: Installation
      description: The chart version and the values you changed (without secrets), the exposure (LoadBalancer, or Ingress and its controller), Postgres or CloudNativePG, and the Kubernetes version and distribution of the clusters involved.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead, with the exact error text, the Audit-ID or X-Request-Id of the response, and the kubelatch-server log lines around it. Without secrets (tokens, kubeconfigs, keys). SUPPORT.md says how to get each one.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Web interface, kubelatch CLI, Proxy (kubectl, Helm, k9s), Reconciler or RBAC, CI exchange, MCP or AI agents, Helm chart, Documentation]
    validations:
      required: true
