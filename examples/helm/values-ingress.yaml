# Example values for the kubelatch chart, oci://ghcr.io/picaportelabs/charts/kubelatch,
# behind an ingress-nginx Ingress that terminates TLS. The default, an L4
# LoadBalancer (values-loadbalancer.yaml), suits kubelatch's long watch, logs
# and exec connections better. The Ingress is not part of the release tests:
# validate it on your cluster (https://docs.kubelatch.com/operate/install/#ingress-alternative).
#
# Before installing (https://docs.kubelatch.com/operate/install/, steps 1 and 2):
# the namespace, labelled pod-security.kubernetes.io/enforce=restricted, and
# the Secret kubelatch-secrets with DATABASE_URL and KUBELATCH_ENCRYPTION_KEY.
# Then:
#
#   helm --kubeconfig "$MGMT_KUBECONFIG" install kubelatch oci://ghcr.io/picaportelabs/charts/kubelatch \
#     --version "$KUBELATCH_VERSION" -n kubelatch -f values-ingress.yaml
#
# Every value, with its default: https://docs.kubelatch.com/reference/helm-values/
exposure: ingress
config:
  baseURL: https://kubelatch.example.com   # the exact public URL, without a trailing slash
  # Required with an Ingress: the ingress controller pods' IPs and nothing
  # else, as CIDRs. 10.244.0.0/16 is a whole kind cluster's pod CIDR, not
  # right for production: narrow it for your cluster.
  trustedProxies: 10.244.0.0/16
ingress:
  host: kubelatch.example.com   # the host of config.baseURL, exactly
  className: nginx

# A cert-manager Certificate for the host of config.baseURL, in the Secret
# the Ingress serves. Either this or a cert-manager.io/cluster-issuer
# annotation in ingress.annotations, never both. Without cert-manager, leave
# both out and create the TLS Secret kubelatch-tls yourself.
tls:
  certManager:
    enabled: true
    issuerRef: {name: letsencrypt, kind: ClusterIssuer}

# The chart's NetworkPolicy lets traffic reach kubelatch's :8080 only from
# the controller's namespace. It needs a CNI that enforces NetworkPolicy.
networkPolicy:
  ingressControllerNamespace: ingress-nginx
