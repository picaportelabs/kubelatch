# Example: run kubectl from GitHub Actions through kubelatch without storing
# any secret in GitHub. The action picaportelabs/kubelatch-action asks GitHub
# for an OIDC id_token whose audience is kubelatch's URL; kubelatch verifies
# it against GitHub's JWKS, matches a trust rule (repository owner id +
# repository id, optionally ref and environment) and answers with a
# short-lived credential and kubeconfig for the rule's bot. The action masks
# both tokens and points KUBECONFIG at the kubeconfig, under RUNNER_TEMP.
# Every kubectl request is audited as that bot.
#
# Setup in kubelatch (once): create a bot in Users, grant it a tier in
# Permissions, and add a trust rule in CI with this repository's numeric
# ids (curl -s https://api.github.com/repos/OWNER/REPO | jq '.owner.id, .id').
# The runner must reach kubelatch over https with a certificate it trusts:
# with a private CA, put its certificate in the runner's system store or set
# NODE_EXTRA_CA_CERTS to it in the job's env, and see
# https://docs.kubelatch.com/operate/install/#certificates-and-a-private-ca
# Without the action (an organisation that allows only its own actions), the
# same two steps in bash are in
# https://docs.kubelatch.com/use/github-actions/#without-the-action
name: kubectl via kubelatch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required: lets the job request the OIDC token
  contents: read

jobs:
  pods:
    runs-on: ubuntu-latest
    # environment: prod   # uncomment if the trust rule sets an environment
    steps:
      - uses: picaportelabs/kubelatch-action@v1
        with:
          url: https://kubelatch.example.com   # exactly KUBELATCH_BASE_URL: it is the token's audience

      - name: kubectl through kubelatch
        run: |
          kubectl auth whoami          # bot:<name> with the kubelatch:* groups of its grants
          kubectl get pods -n default
